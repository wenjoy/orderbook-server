[package]
name = "orderbook-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = {version = "1.53.3", features=["full"]}
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
