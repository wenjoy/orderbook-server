services:
  postgres:
    image: postgres:16-alpine
    container_name: orderbook
    ports:
      - "127.0.0.1:6432:5432"
    environment:
        POSTGRES_USER: orderbook
        POSTGRES_PASSWORD: 123
        POSTGRES_DB: orderbook_markets
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
